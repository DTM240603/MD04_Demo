server:
  port: 8081
spring:
  application:
    name: inventory-service
  datasource:
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: 123456
    url: jdbc:postgresql://localhost:5432/inventory_db
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
        defaultZone: http://localhost:8761/eureka/
